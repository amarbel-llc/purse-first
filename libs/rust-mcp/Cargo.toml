[package]
name = "mcp-server"
version = "0.1.0"
edition = "2021"
description = "Reusable Rust library for building MCP (Model Context Protocol) servers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/friedenberg/rust-lib-mcp"

[features]
default = ["tools", "resources", "prompts"]
tools = []
resources = []
prompts = []
sampling = []
tasks = []
elicitation = []
completions = []
http-transport = ["tokio/net", "tokio/time"]
command-executor = ["tokio/process", "tokio/time"]

[dependencies]
tokio = { version = "1", features = ["rt", "sync", "io-util", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[[example]]
name = "simple_tools"
required-features = ["tools"]
