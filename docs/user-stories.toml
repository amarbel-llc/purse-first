[meta]
project = "go-lib-mcp"
repo = "amarbel-llc/purse-first"
last_updated = 2026-02-19

[[stories]]
id = "short-flags"
title = "Support short flags in command framework"
priority = 1
status = "not-started"
evidence = [
  "libs/go-mcp/command/cli.go",
  "libs/go-mcp/command/command.go",
]
acceptance = [
  "Param has an optional Short rune field",
  "parseFlags recognizes -x style flags and maps them to the named param",
  "Short flags appear in --help output, manpages, and shell completions",
  "Existing long-flag behavior is unchanged",
]

[[stories]]
id = "output-format-awareness"
title = "Mode-aware output so handlers render differently for CLI vs MCP"
priority = 2
status = "not-started"
evidence = [
  "libs/go-mcp/command/result.go",
  "libs/go-mcp/command/mcp.go",
  "libs/go-mcp/command/cli.go",
]
acceptance = [
  "Run handlers can detect whether they are executing in CLI or MCP mode",
  "CLI mode supports styled terminal output (lipgloss tables) alongside plain text",
  "MCP mode always returns text or JSON via Result",
  "No handler duplication required for commands that render tables in CLI and JSON in MCP",
]

[[stories]]
id = "format-param-convention"
title = "Framework-level --format global param with tap, table, json, text modes"
priority = 3
status = "not-started"
evidence = [
  "libs/go-mcp/command/app.go",
  "libs/go-mcp/command/cli.go",
]
acceptance = [
  "App can declare a --format global param recognized by the framework",
  "Commands can read the format value from context or request",
  "Framework does not enforce format rendering, but provides the plumbing",
  "Default format is configurable per-app",
]

[[stories]]
id = "prompter-extensions"
