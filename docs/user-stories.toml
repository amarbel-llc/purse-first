[[stories]]
id = "migrate-grit"
title = "Migrate grit from flag to command framework"
priority = 6
status = "not-started"
evidence = [
  "docs/plans/2026-02-16-unified-command-framework-design.md",
]
acceptance = [
  "grit uses command.App and command.Command instead of flag package",
  "grit's hand-written JSON schemas are replaced by auto-generated InputSchema",
  "grit's PluginBuilder chain is removed",
  "All existing MCP tools still work identically",
  "CLI help output is equivalent or better",
  "Manpages, completions, plugin.json, mappings.json are generated by GenerateAll",
]

